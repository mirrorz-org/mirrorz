<!DOCTYPE html>
<!-- {{ }} is posthtml-expressions syntax -->
<html lang="{{ lang }}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ title }}</title>
    <each loop="v, k in meta">
      <meta property="{{ k }}" content="{{ v }}" />
    </each>
    <script>
      try {
        const theme = localStorage.getItem("mirrorz-theme");
        if (theme === "light" || theme === "dark") {
          document.documentElement.dataset.theme = theme;
        }
      } catch (_) {}
    </script>
    <link rel="stylesheet" href="./src/css/style.scss" />
    <link rel="icon" type="image/svg+xml" href="/static/img/mirrorz.svg" />
    <!-- <link rel="preload" as="stylesheet" href="./src/css/deferred.scss"> -->
    <script type="module" src="./src/index.jsx"></script>
  </head>
  <body>
    <style>
      .loading {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
      }
    </style>
    <noscript>{{ javascript }}</noscript>
    <div id="app"><div class="loading">{{ loading }}</div></div>
  </body>
</html>
